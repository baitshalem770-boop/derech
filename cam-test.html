<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת מצלמה</title>
<style>body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#0b1220;color:#e5e7eb}
button{font-size:17px;padding:12px 18px;border-radius:10px;border:0;background:#e9b949;color:#241a00;font-weight:700;margin:4px 0}
video,canvas{width:100%;max-height:40vh;background:#000;border:1px solid #334;border-radius:8px;object-fit:contain}
pre{white-space:pre-wrap;word-break:break-word;background:#111a2e;padding:10px;border-radius:8px;font-size:13px;direction:ltr;text-align:left}</style></head><body>
<h2>בדיקת מצלמה</h2>
<button id="go">הפעלת מצלמה ובדיקה</button> <button id="exp">ניסויים נוספים (לבטא)</button><br>
<video id="v" playsinline muted autoplay></video>
<p>תצוגה דרך canvas:</p><canvas id="c" width="320" height="240"></canvas>
<p>העתיקו את הטקסט שלמטה ושלחו לי:</p><pre id="out">ממתין...</pre>
<script>
var out=document.getElementById('out'),L=[];function log(m){L.push(m);out.textContent=L.join('\n');}
log('UA: '+navigator.userAgent);log('secure: '+window.isSecureContext+' | '+location.protocol);
log('mediaDevices: '+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));
var v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d');
var tries=[['environment-ideal',{video:{facingMode:{ideal:'environment'}},audio:false}],['video:true',{video:true,audio:false}],['user',{video:{facingMode:'user'},audio:false}]];
function brightness(){try{c.width=v.videoWidth||320;c.height=v.videoHeight||240;x.drawImage(v,0,0,c.width,c.height);var d=x.getImageData(0,0,c.width,c.height).data,s=0,n=0;for(var i=0;i<d.length;i+=4*97){s+=d[i]+d[i+1]+d[i+2];n+=3}return Math.round(s/n)}catch(e){return 'err '+e.name}}
var cur=null;function stopCur(){if(cur){cur.getTracks().forEach(function(t){t.stop()});cur=null}v.srcObject=null}
function testStream(name,cons,next){
  log('--- '+name);
  navigator.mediaDevices.getUserMedia(cons).then(function(st){
    stopCur();cur=st;var t=st.getVideoTracks()[0];log('stream OK | label: '+t.label+' | state: '+t.readyState);
    try{var g=t.getSettings();log('settings: '+g.width+'x'+g.height+' @'+g.frameRate+' '+(g.facingMode||''))}catch(e){}
    t.onended=function(){log('  (track ended)')};
    v.srcObject=st;var p=v.play();if(p&&p.catch)p.catch(function(e){log('play() error: '+e.name)});
    setTimeout(function(){var ok=v.videoWidth>16;log('video: '+v.videoWidth+'x'+v.videoHeight+' | state '+t.readyState+' | brightness '+brightness()+(ok?'  ✅ עובד':'  ❌ אין תמונה'));stopCur();setTimeout(next,400)},2500);
  }).catch(function(e){log('שגיאה: '+e.name+' - '+e.message);setTimeout(next,300)});
}
function run(i){
  if(i<tries.length){testStream('ניסיון '+(i+1)+': '+tries[i][0],tries[i][1],function(){run(i+1)});return}
  navigator.mediaDevices.enumerateDevices().then(function(ds){
    var cams=ds.filter(function(d){return d.kind==='videoinput'});log('=== נמצאו '+cams.length+' מצלמות, בודקים כל אחת ===');
    (function each(k){if(k>=cams.length){log('סיום');return}
      testStream('מצלמה '+(k+1)+': '+(cams[k].label||'?'),{video:{deviceId:{exact:cams[k].deviceId},frameRate:{ideal:30}},audio:false},function(){each(k+1)})})(0);
  });
}
document.getElementById('go').onclick=function(){L.length=2;run(0)};

/* ===== ניסויים לעקיפת תקלה שבה המצלמה נסגרת מיד ===== */
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function probe(name,cons,opt){
  opt=opt||{};log('--- '+name);var t0=Date.now();
  return navigator.mediaDevices.getUserMedia(cons).then(function(st){
    var t=st.getVideoTracks()[0];log('  label: '+t.label+' | state אחרי פתיחה: '+t.readyState);
    t.addEventListener('ended',function(){log('  (נסגר אחרי '+(Date.now()-t0)+'ms)')});
    var pre=opt.noVideo?wait(1500):Promise.resolve();
    return pre.then(function(){
      if(opt.noVideo)log('  בלי חיבור לווידאו, אחרי 1.5 שניות: '+t.readyState);
      stopCur();cur=st;v.srcObject=st;var p=v.play();if(p&&p.catch)p.catch(function(e){log('  play(): '+e.name)});
      return wait(2500);
    }).then(function(){
      var ok=v.videoWidth>16;log('  video: '+v.videoWidth+'x'+v.videoHeight+' | '+t.readyState+' | brightness '+brightness()+(ok?'  ✅ עובד':'  ❌'));
      if(opt.photo&&window.ImageCapture&&t.readyState==='live'){
        return new ImageCapture(t).grabFrame().then(function(b){log('  ImageCapture.grabFrame: '+b.width+'x'+b.height+' ✅')}).catch(function(e){log('  ImageCapture: '+e.name)});
      }
    }).then(function(){if(!opt.keep)stopCur();else cur=null;return st});
  }).catch(function(e){log('  שגיאה: '+e.name+' - '+e.message)}).then(function(r){return wait(500).then(function(){return r})});
}
function experiments(){
  L.length=2;log('Chrome: '+((navigator.userAgentData&&navigator.userAgentData.brands||[]).map(function(b){return b.brand+' '+b.version}).join(', ')));
  var back=null;
  var steps=[
    function(){return probe('א. בלי לחבר לווידאו (האם נסגר מעצמו?)',{video:{facingMode:{ideal:'environment'}}},{noVideo:true})},
    function(){return probe('ב. 30 פריימים מקסימום',{video:{facingMode:{ideal:'environment'},frameRate:{max:30}}})},
    function(){return probe('ג. 15 פריימים מקסימום',{video:{facingMode:{ideal:'environment'},frameRate:{max:15}}})},
    function(){return probe('ד. 1280x720',{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})},
    function(){return probe('ה. 1920x1080',{video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})},
    function(){return probe('ו. 320x240',{video:{facingMode:{ideal:'environment'},width:{ideal:320},height:{ideal:240}}})},
    function(){return navigator.mediaDevices.enumerateDevices().then(function(ds){
      back=ds.filter(function(d){return d.kind==='videoinput'&&/camera 0/.test(d.label)})[0];
      if(!back){log('--- ז. camera 0 לא נמצאה');return}
      return probe('ז. camera 0 ישירות, 1280x720',{video:{deviceId:{exact:back.deviceId},width:{ideal:1280},height:{ideal:720}}});})},
    function(){return probe('ח. ניסיון חוזר אחרי המתנה של 3 שניות',{video:{facingMode:{ideal:'environment'}}})},
    function(){return probe('ט. פתיחה ראשונה ומשאירים פתוח',{video:true},{keep:true}).then(function(first){
      return probe('ט2. פתיחה שנייה כשהראשונה עדיין פתוחה',{video:{facingMode:{ideal:'environment'}}},{photo:true}).then(function(){if(first)first.getTracks().forEach(function(t){t.stop()})});})},
    function(){return probe('י. עם מיקרופון (audio:true)',{video:{facingMode:{ideal:'environment'}},audio:true})}
  ];
  var i=0;(function next(){if(i>=steps.length){log('סיום הניסויים');return}var f=steps[i++];(i===8?wait(3000):Promise.resolve()).then(f).then(next,next)})();
}
document.getElementById('exp').onclick=experiments;
</script></body></html>
